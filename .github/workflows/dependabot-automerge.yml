name: dependabot-automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Precondition note: enabling auto-merge does NOT bypass CI. Merge is
      # still blocked until the branch-protection required checks pass (see
      # site-docs/docs/runbooks/branch-protection.md). This step only queues
      # the merge for patch updates that clear those gates.
      - name: Enable auto-merge for safe patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }`,
              {
                pullRequestId: context.payload.pull_request.node_id,
              }
            );

            core.notice(`Auto-merge enabled for Dependabot patch PR #${prNumber}.`);

      - name: Skip non-patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: |
          echo "Auto-merge skipped: only semver patch updates are auto-merged." >> "$GITHUB_STEP_SUMMARY"
          echo "Detected update type: ${{ steps.metadata.outputs.update-type }}" >> "$GITHUB_STEP_SUMMARY"
