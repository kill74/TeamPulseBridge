name: security-scan

on:
  push:
    branches: ["main", "master"]
    paths:
      - "services/ingestion-gateway/**"
      - "services/ingestion-gateway/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/security-scan.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "services/ingestion-gateway/**"
      - "services/ingestion-gateway/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/security-scan.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-image-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build ingestion-gateway image
        working-directory: services/ingestion-gateway
        run: docker build -t teampulsebridge-ingestion-gateway:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: teampulsebridge-ingestion-gateway:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Warn-only on PRs/pushes (SARIF still uploaded); fail closed on
          # the weekly schedule so new upstream CVEs stay visible.
          exit-code: ${{ github.event_name == 'schedule' && '1' || '0' }}
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          # Warn-only on PRs/pushes; fail closed on the weekly schedule.
          exit-code: ${{ github.event_name == 'schedule' && '1' || '0' }}
          ignore-unfixed: true

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: "1.26.x"
          work-dir: services/ingestion-gateway
