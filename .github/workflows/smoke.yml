name: smoke

on:
  pull_request:
    paths:
      - "services/ingestion-gateway/**"
      - "docker-compose.yml"
      - "deploy/monitoring/**"
      - "Makefile"
      - ".github/workflows/smoke.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "services/ingestion-gateway/**"
      - "docker-compose.yml"
      - "deploy/monitoring/**"
      - "Makefile"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate root compose config
        run: docker compose -f docker-compose.yml config --quiet

      - name: Clean stale stack (avoid port conflicts)
        run: docker compose -f services/ingestion-gateway/docker-compose.integration.yml down -v || true

      - name: Build and start stack
        run: docker compose -f services/ingestion-gateway/docker-compose.integration.yml up -d --build

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -e
          # Wait up to 180s for the service to become healthy
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "healthz is up"
              exit 0
            fi
            sleep 3
          done
          echo "healthz did not become ready in time"
          exit 1

      - name: Validate metrics endpoint
        run: |
          set -e
          curl -fsS http://localhost:8080/metrics | grep -q "go_"

      - name: Show compose status
        if: always()
        run: docker compose -f services/ingestion-gateway/docker-compose.integration.yml ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f services/ingestion-gateway/docker-compose.integration.yml logs --no-color --tail=200

      - name: Shutdown stack
        if: always()
        run: docker compose -f services/ingestion-gateway/docker-compose.integration.yml down -v

  smoke-root-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Clean stale stack (avoid port conflicts)
        run: docker compose down -v || true

      - name: Build and start root stack (mirrors `make ci-smoke`)
        run: docker compose up -d --build

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -e
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "healthz is up"
              curl -fsS http://localhost:8080/metrics | grep -q "go_"
              docker compose ps
              exit 0
            fi
            sleep 3
          done
          echo "healthz did not become ready in time"
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Shutdown stack
        if: always()
        run: docker compose down -v
