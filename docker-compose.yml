services:
  pubsub-emulator:
    image: google/cloud-sdk:emulators
    container_name: teampulse-pubsub-emulator
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - '8085:8085'
    profiles:
      - pubsub-local
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/8085"']
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

  pubsub-init:
    image: google/cloud-sdk:emulators
    container_name: teampulse-pubsub-init
    profiles:
      - pubsub-local
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
    command: >
      bash -lc "
      gcloud pubsub topics create webhook-events --project=test-project || true;
      gcloud pubsub subscriptions create webhook-events-store --topic=webhook-events --project=test-project || true
      "
    depends_on:
      pubsub-emulator:
        condition: service_healthy

  ingestion-gateway:
    build:
      context: ./services/ingestion-gateway
      dockerfile: Dockerfile
    container_name: teampulse-ingestion-gateway
    environment:
      PORT: 8080
      REQUIRE_SECRETS: 'true'
      QUEUE_BACKEND: ${QUEUE_BACKEND:-log}
      # Perf-tuned local defaults (see docs/performance.md).
      QUEUE_WORKERS: ${QUEUE_WORKERS:-16}
      QUEUE_BULKHEAD_ENABLED: ${QUEUE_BULKHEAD_ENABLED:-true}
      QUEUE_BULKHEAD_MAX_SOURCES: ${QUEUE_BULKHEAD_MAX_SOURCES:-8}
      QUEUE_BUFFER: ${QUEUE_BUFFER:-4096}
      PUBSUB_PUBLISH_GOROUTINES: ${PUBSUB_PUBLISH_GOROUTINES:-16}
      PUBSUB_BATCH_DELAY_MS: ${PUBSUB_BATCH_DELAY_MS:-20}
      PUBSUB_MAX_OUTSTANDING_MESSAGES: ${PUBSUB_MAX_OUTSTANDING_MESSAGES:-2000}
      PUBSUB_FLOW_CONTROL_BEHAVIOR: ${PUBSUB_FLOW_CONTROL_BEHAVIOR:-signal_error}
      PII_SCRUB_ASYNC: ${PII_SCRUB_ASYNC:-true}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-32}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-8}
      REDIS_IO_TIMEOUT_MS: ${REDIS_IO_TIMEOUT_MS:-100}
      HTTP_MAX_INFLIGHT: ${HTTP_MAX_INFLIGHT:-512}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-0.02}
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: 4
      ADMIN_AUTH_ENABLED: 'true'
      ENVIRONMENT: local
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://teampulse:secret@postgres:5432/teampulse?sslmode=disable
      RATE_LIMIT_BACKEND: redis
      ADMIN_JWT_ISSUER: local
      ADMIN_JWT_AUDIENCE: local
      ADMIN_JWT_SECRET: local-dev-must-be-32-chars-long-or-more
      PUBSUB_EMULATOR_HOST: ${PUBSUB_EMULATOR_HOST:-}
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-test-project}
      PUBSUB_TOPIC_ID: ${PUBSUB_TOPIC_ID:-webhook-events}
    ports:
      - '8080:8080'
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    # NOTE: no container healthcheck here — the runtime image is distroless
    # (no shell/wget). Health is verified externally via curl /healthz in
    # Makefile ci-smoke and by K8s liveness/readiness probes in production.

  event-store:
    build:
      context: ./services/ingestion-gateway
      dockerfile: Dockerfile
    container_name: teampulse-event-store
    entrypoint: ["/app/eventstore"]
    profiles:
      - pubsub-local
    environment:
      DATABASE_URL: postgres://teampulse:secret@postgres:5432/teampulse?sslmode=disable
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: test-project
      EVENTSTORE_PUBSUB_SUBSCRIPTION_ID: webhook-events-store
      EVENTSTORE_MAX_OUTSTANDING_MESSAGES: ${EVENTSTORE_MAX_OUTSTANDING_MESSAGES:-2000}
      EVENTSTORE_MAX_OUTSTANDING_BYTES: ${EVENTSTORE_MAX_OUTSTANDING_BYTES:-268435456}
      EVENTSTORE_RECEIVE_GOROUTINES: ${EVENTSTORE_RECEIVE_GOROUTINES:-16}
      EVENTSTORE_MAX_EXTENSION_SEC: ${EVENTSTORE_MAX_EXTENSION_SEC:-600}
      EVENTSTORE_DB_MAX_CONNS: ${EVENTSTORE_DB_MAX_CONNS:-32}
      EVENTSTORE_DB_MIN_CONNS: ${EVENTSTORE_DB_MIN_CONNS:-8}
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: teampulse-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: teampulse-postgres
    environment:
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: teampulse
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: teampulse-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - ingestion-gateway

  grafana:
    image: grafana/grafana:11.2.0
    container_name: teampulse-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-teampulse-local-dev-password-change-in-production}
    ports:
      - '3000:3000'
    volumes:
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
